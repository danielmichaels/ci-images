name: Push to GHCR and DockerHub (Parallel)

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs at 00:00 UTC every Sunday
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io/${{ github.repository_owner }}
  DOCKERHUB: danielmichaels
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute date tag
        id: tag
        run: echo "tag=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

  # These images only download release binaries, so the emulated leg costs
  # almost nothing and one job can build both architectures.
  build-base-images:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        image: [goose, taskfile, templ, linters, tailwind]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: danielmichaels
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          platforms: ${{ env.PLATFORMS }}
          pull: true
          no-cache: true
          push: true
          tags: |
            ${{ env.GHCR }}/ci-${{ matrix.image }}:latest
            ${{ env.GHCR }}/ci-${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
            ${{ env.DOCKERHUB }}/ci-${{ matrix.image }}:latest
            ${{ env.DOCKERHUB }}/ci-${{ matrix.image }}:${{ needs.prepare.outputs.tag }}

  # goa publishes no prebuilt binaries and is the only image still compiled
  # from source, so it is the only one that actually pays for QEMU. Build each
  # architecture on a native runner and stitch them together afterwards.
  build-goa:
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: danielmichaels
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushed by digest and left untagged; merge-goa applies the tags once
      # both architectures exist, so :latest never points at a half-built pair.
      - name: Build and push goa by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./goa
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: true
          outputs: |
            type=image,name=${{ env.GHCR }}/ci-goa,push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ env.DOCKERHUB }}/ci-goa,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-goa-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-goa:
    runs-on: ubuntu-latest
    needs: [prepare, build-goa]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-goa-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: danielmichaels
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifests
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eu
          for reg in "${GHCR}" "${DOCKERHUB}"; do
            refs=""
            for d in *; do
              refs="${refs} ${reg}/ci-goa@sha256:${d}"
            done
            # shellcheck disable=SC2086
            docker buildx imagetools create \
              -t "${reg}/ci-goa:latest" \
              -t "${reg}/ci-goa:${TAG}" \
              ${refs}
          done
        env:
          GHCR: ${{ env.GHCR }}
          DOCKERHUB: ${{ env.DOCKERHUB }}
          TAG: ${{ needs.prepare.outputs.tag }}

  build-toolkit:
    runs-on: ubuntu-latest
    needs: [prepare, build-base-images, merge-goa]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: danielmichaels
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # TAG pins the base images to the ones this run just pushed, so a
      # date-tagged toolkit always matches its date-tagged inputs.
      - name: Build and push toolkit
        uses: docker/build-push-action@v7
        with:
          context: ./toolkit
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            REGISTRY=${{ env.GHCR }}
            TAG=${{ needs.prepare.outputs.tag }}
          pull: true
          no-cache: true
          push: true
          tags: |
            ${{ env.GHCR }}/ci-toolkit:latest
            ${{ env.GHCR }}/ci-toolkit:${{ needs.prepare.outputs.tag }}
            ${{ env.DOCKERHUB }}/ci-toolkit:latest
            ${{ env.DOCKERHUB }}/ci-toolkit:${{ needs.prepare.outputs.tag }}
