name: Push to GHCR and DockerHub (Parallel)

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs at 00:00 UTC every Sunday
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io/${{ github.repository_owner }}
  DOCKERHUB: danielmichaels
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute date tag
        id: tag
        run: echo "tag=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

  build-base-images:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        image: [goose, taskfile, goa, templ, linters, tailwind]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: danielmichaels
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          platforms: ${{ env.PLATFORMS }}
          pull: true
          no-cache: true
          push: true
          tags: |
            ${{ env.GHCR }}/ci-${{ matrix.image }}:latest
            ${{ env.GHCR }}/ci-${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
            ${{ env.DOCKERHUB }}/ci-${{ matrix.image }}:latest
            ${{ env.DOCKERHUB }}/ci-${{ matrix.image }}:${{ needs.prepare.outputs.tag }}

  build-toolkit:
    runs-on: ubuntu-latest
    needs: [prepare, build-base-images]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: danielmichaels
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # TAG pins the base images to the ones this run just pushed, so a
      # date-tagged toolkit always matches its date-tagged inputs.
      - name: Build and push toolkit
        uses: docker/build-push-action@v7
        with:
          context: ./toolkit
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            REGISTRY=${{ env.GHCR }}
            TAG=${{ needs.prepare.outputs.tag }}
          pull: true
          no-cache: true
          push: true
          tags: |
            ${{ env.GHCR }}/ci-toolkit:latest
            ${{ env.GHCR }}/ci-toolkit:${{ needs.prepare.outputs.tag }}
            ${{ env.DOCKERHUB }}/ci-toolkit:latest
            ${{ env.DOCKERHUB }}/ci-toolkit:${{ needs.prepare.outputs.tag }}
